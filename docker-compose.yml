services:
  mysql:
    image: mysql:8.0.40
    container_name: job-management-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: job_management
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./job-management/job-management
    container_name: job-management-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/job_management?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: job-management-secret-key-must-be-at-least-32-characters
      JWT_EXPIRATION: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175
      CV_UPLOAD_DIR: uploads/cv
      APP_SEED_ADMIN_EMAIL: admin@example.com
      APP_SEED_ADMIN_PASSWORD: 123456
    ports:
      - "8080:8080"
    volumes:
      - cv_uploads:/app/uploads

volumes:
  mysql_data:
  cv_uploads:
