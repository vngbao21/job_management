server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: job-management
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/job_management}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
  seed:
    admin:
      email: ${APP_SEED_ADMIN_EMAIL:admin@example.com}
      password: ${APP_SEED_ADMIN_PASSWORD:123456}

jwt:
  secret: ${JWT_SECRET:change-this-secret-before-production}
  expiration: ${JWT_EXPIRATION:86400000}
