server:
  port: 8080

spring:
  application:
    name: job-management
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/job_management}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:change-this-secret-before-production}
  expiration: 86400000
